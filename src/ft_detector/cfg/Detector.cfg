#!/usr/bin/env python3
# ============================================================
# dynamic_reconfigure 定义
# 这里暴露的参数可以在 rqt_reconfigure 里拖动，实时改检测阈值。
# 注意：这里的默认值要和 config/detector.yaml 保持一致。
# ============================================================
PACKAGE = "ft_detector"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# 红色跨 0 度：两段 H 范围
gen.add("red_h_min", int_t, 0, "red H min", 0, 0, 180)
gen.add("red_h_max", int_t, 0, "red H max", 10, 0, 180)
gen.add("red_h_min2", int_t, 0, "red H min 2", 170, 0, 180)
gen.add("red_h_max2", int_t, 0, "red H max 2", 180, 0, 180)

# 蓝色 H 范围
gen.add("blue_h_min", int_t, 0, "blue H min", 100, 0, 180)
gen.add("blue_h_max", int_t, 0, "blue H max", 130, 0, 180)

# S/V 下限：太暗/太灰的像素不要
gen.add("s_min", int_t, 0, "S min", 80, 0, 255)
gen.add("v_min", int_t, 0, "V min", 80, 0, 255)

# 轮廓/配对门限
gen.add("min_area", int_t, 0, "min contour area", 10, 0, 10000)
gen.add("max_angle_diff", double_t, 0, "max light bar angle diff (deg)", 25.0, 0, 90)
gen.add("max_height_diff", double_t, 0, "max light bar height ratio", 0.6, 0, 1)
gen.add("max_gap", double_t, 0, "max light bar gap (px)", 600, 0, 2000)

exit(gen.generate(PACKAGE, PACKAGE, "Detector"))
